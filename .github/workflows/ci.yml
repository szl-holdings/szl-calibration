name: ci
on:
  push: {branches: [main]}
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e '.[dev]'
      - run: pytest -q
  weight-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python tests/make_fixtures.py
      - name: clean fixture must ALLOW
        run: python -m szl_calibration.gate_cli tests/fixtures/tiny.safetensors --expect ALLOW
      - name: truncated fixture must BLOCK
        run: python -m szl_calibration.gate_cli tests/fixtures/truncated.safetensors --expect BLOCK
