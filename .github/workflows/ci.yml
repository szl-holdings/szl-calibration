name: ci
on:
  push: {branches: [main]}
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e '.[dev]'
      - run: pytest -q
  weight-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python tests/make_fixtures.py
      - name: clean fixture must ALLOW
        run: python -m szl_calibration.gate_cli tests/fixtures/tiny.safetensors --expect ALLOW
      - name: truncated fixture must BLOCK
        run: python -m szl_calibration.gate_cli tests/fixtures/truncated.safetensors --expect BLOCK
