[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-calibration"
version = "0.1.1"
description = "SZL Calibration Intelligence Plane - exact calibration metrics, UNSIGNED_HONEST receipt chain, fail-closed weight gates, FastAPI + Prometheus surface."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-calibration"
Source = "https://github.com/szl-holdings/szl-calibration"
Issues = "https://github.com/szl-holdings/szl-calibration/issues"
Changelog = "https://github.com/szl-holdings/szl-calibration/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.szl.release]
import_names = ["szl_calibration"] # wheel top-level import names; the release gate fails if the built wheel differs
